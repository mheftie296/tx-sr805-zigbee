CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y
CONFIG_GPIO=y

# Keep printk and the log on the debug interface of the board (USB CDC ACM on
# the Pro Micro nRF52840), UART1 is reserved for the ISCP link.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7

CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_ROUTER=y

# The device joins a network that another device created. A coordinator of
# another ecosystem, such as Home Assistant, does not necessarily work on
# channel 16, which is the only channel the default single channel selection
# mode scans.
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y

# Scanning all the channels of the channel mask needs one queue element per
# channel, next to the elements that the ISCP link posts.
CONFIG_ZIGBEE_APP_CB_QUEUE_LENGTH=17

# Enable DK LED and Buttons library
CONFIG_DK_LIBRARY=y

# The application callback queue carries the receiver state reported over the
# serial link, and ZBOSS shares the workqueue with the ISCP worker.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
